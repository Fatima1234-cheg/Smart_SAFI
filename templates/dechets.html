<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Smart City Safi - Gestion des déchets (4 régions)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial; background: #1a1a2e; color: white; display: flex; flex-direction: column; min-height: 100vh; }
        
        /* Header */
        .header { background: linear-gradient(135deg, #0f0f23, #1a1a2e); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; border-bottom: 1px solid #333; gap: 10px; }
        h1 { color: #ffd700; font-size: 1.5em; }
        .subtitle { color: #aaa; font-size: 0.8em; }
        .stats { display: flex; gap: 20px; }
        .stat { text-align: center; padding: 5px 15px; background: rgba(255,255,255,0.1); border-radius: 20px; }
        .stat-value { font-size: 1.2em; font-weight: bold; }
        .stat-label { font-size: 0.7em; color: #aaa; }
        .nav-buttons { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .btn-retour, .btn-vider, .btn-hist, .btn-opti { background: linear-gradient(135deg, #ffd700, #ff8c00); color: #1a1a2e; border: none; padding: 8px 20px; border-radius: 25px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-vider { background: linear-gradient(135deg, #ff4444, #880000); color: white; }
        .btn-hist { background: linear-gradient(135deg, #2c3e50, #1a252f); color: white; }
        .btn-opti { background: linear-gradient(135deg, #27ae60, #1e8449); color: white; }
        .btn-vider:hover, .btn-retour:hover, .btn-hist:hover, .btn-opti:hover { transform: scale(1.05); box-shadow: 0 0 12px rgba(255,215,0,0.5); }
        
        /* Carte pleine largeur */
        #map { width: 100%; height: 500px; margin: 0; border-bottom: 1px solid #333; }
        
        /* Conteneur des 4 cartes régions */
        .regions-cards {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
            background: #0f0f23;
            justify-content: center;
        }
        .region-card {
            background: rgba(20, 30, 55, 0.8);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 15px;
            flex: 1;
            min-width: 200px;
            border: 1px solid rgba(255,215,0,0.3);
            transition: 0.2s;
        }
        .region-card:hover { transform: translateY(-5px); border-color: #ffd700; }
        .region-card h3 { margin-bottom: 10px; color: #ffd700; display: flex; justify-content: space-between; }
        .region-card .badge { font-size: 0.7rem; background: #333; padding: 2px 8px; border-radius: 20px; }
        .region-card .niveau-moyen { font-size: 1.8rem; font-weight: bold; margin: 10px 0; }
        .region-card .details { font-size: 0.8rem; display: flex; justify-content: space-between; margin-top: 8px; }
        .region-card .progress { height: 6px; background: #333; border-radius: 3px; margin: 8px 0; }
        .region-card .progress-bar { height: 100%; border-radius: 3px; background: #ffd700; width: 0%; }
        .region-card .type-list { font-size: 0.7rem; color: #ccc; margin-top: 8px; }
        .region-actions { display: flex; gap: 8px; margin-top: 12px; }
        .btn-small { background: #ffd700; border: none; padding: 5px 10px; border-radius: 20px; cursor: pointer; font-size: 0.7rem; font-weight: bold; }
        .btn-small.danger { background: #ff4444; color: white; }
        
        /* Sidebar originale supprimée, on utilise les cartes */
        .timestamp { text-align: center; padding: 8px; font-size: 0.7em; color: #aaa; background: rgba(0,0,0,0.3); }
        
        /* Modal historique */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #1a1a2e;
            border-radius: 20px;
            width: 90%;
            max-width: 800px;
            max-height: 80%;
            overflow-y: auto;
            padding: 20px;
            border: 1px solid #ffd700;
        }
        .modal-content h3 { margin-bottom: 15px; color: #ffd700; }
        .modal-content table { width: 100%; border-collapse: collapse; }
        .modal-content th, .modal-content td { border: 1px solid #333; padding: 8px; text-align: left; }
        .modal-content th { background: #0f0f23; }
        .close-modal { float: right; font-size: 24px; cursor: pointer; color: #ffd700; }
        
        @media (max-width: 768px) {
            .regions-cards { flex-direction: column; align-items: stretch; }
            #map { height: 350px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>🗑️ SMART CITY SAFI - 4 RÉGIONS INTELLIGENTES</h1>
            <div class="subtitle">📍 Nord • Sud • Est • Ouest | Données temps réel</div>
        </div>
        <div class="nav-buttons">
            <button class="btn-retour" onclick="window.location.href='/admin'">🏠 Dashboard</button>
            <button class="btn-opti" onclick="window.location.href='/optimisation'">🗺️ Optimiser trajet</button>
            <button class="btn-hist" id="btnHistorique">📅 Historique</button>
        </div>
        <div class="stats">
            <div class="stat"><div class="stat-value" id="statTotal">0</div><div class="stat-label">Poubelles</div></div>
            <div class="stat"><div class="stat-value" id="statUrgence">0</div><div class="stat-label">Urgences (>80%)</div></div>
            <div class="stat"><div class="stat-value" id="statOdeur">0</div><div class="stat-label">Odeur >70%</div></div>
        </div>
    </div>
    
    <!-- Carte pleine largeur -->
    <div id="map"></div>
    
    <!-- 4 cartes régionales -->
    <div class="regions-cards" id="regionsCards"></div>
    
    <div class="timestamp" id="timestamp">🕐 Connexion au serveur...</div>
    
    <!-- Modal Historique -->
    <div id="historyModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h3>📋 Historique des vidanges</h3>
            <div id="historyTable"></div>
        </div>
    </div>
    
    <script>
        // ==================== DONNÉES STATIQUES ====================
        const REGIONS = {
            nord: { nom: "Nord", center: [32.3200, -9.2350], couleur: "#3498db" },
            sud: { nom: "Sud", center: [32.2600, -9.2300], couleur: "#2ecc71" },
            est: { nom: "Est", center: [32.2900, -9.1900], couleur: "#e67e22" },
            ouest: { nom: "Ouest", center: [32.2850, -9.2600], couleur: "#9b59b6" }
        };
        
        // Génération des 16 poubelles (coordonnées réalistes)
        let poubellesData = [];
        let markers = {};
        let map;
        let socket;
        
        // Stockage de l'historique (simulé avec localStorage)
        let historique = [];
        
        function initHistorique() {
            const saved = localStorage.getItem('smartcity_historique');
            if (saved) {
                historique = JSON.parse(saved);
            } else {
                // Exemple de données initiales
                historique = [
                    { date: "2026-04-21 14:30:00", region: "nord", camionType: "moyen", nbBins: 2, urgentes: 2 },
                    { date: "2026-04-21 09:15:00", region: "sud", camionType: "grand", nbBins: 3, urgentes: 3 }
                ];
                sauvegarderHistorique();
            }
        }
        
        function sauvegarderHistorique() {
            localStorage.setItem('smartcity_historique', JSON.stringify(historique));
        }
        
        function ajouterHistorique(region, camionType, nbBins, urgentes) {
            const now = new Date();
            const dateStr = now.toLocaleString('fr-FR');
            historique.unshift({ date: dateStr, region, camionType, nbBins, urgentes });
            sauvegarderHistorique();
        }
        
        function afficherHistorique() {
            const container = document.getElementById('historyTable');
            if (!container) return;
            if (historique.length === 0) {
                container.innerHTML = "<p>Aucun historique pour le moment.</p>";
                return;
            }
            let html = '<table><tr><th>Date</th><th>Région</th><th>Camion</th><th>Poubelles vidées</th><th>Urgentes</th></tr>';
            historique.forEach(entry => {
                const regionNom = REGIONS[entry.region]?.nom || entry.region;
                html += `<tr>
                            <td>${entry.date}</td>
                            <td>${regionNom}</td>
                            <td>${entry.camionType}</td>
                            <td>${entry.nbBins}</td>
                            <td>${entry.urgentes}</td>
                         </tr>`;
            });
            html += '</table>';
            container.innerHTML = html;
        }
        
        // ==================== CARTE ====================
        function initMap() {
            map = L.map('map').setView([32.2833, -9.2333], 12.5);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> | Safi',
                subdomains: 'abcd',
                maxZoom: 19
            }).addTo(map);
        }
        
        function getIcone(p) {
            let niveau = p.niveau;
            let couleur = '#00ff00';
            let taille = 32;
            let emoji = '🗑️';
            if (niveau >= 80) { couleur = '#ff0000'; taille = 44; }
            else if (niveau >= 60) { couleur = '#ffaa00'; taille = 38; }
            if (p.type === 'VERRE') emoji = '🥤';
            else if (p.type === 'CARTON') emoji = '📦';
            else if (p.type === 'MENAGER') emoji = '🍌';
            else if (p.type === 'PAPIER') emoji = '📄';
            return L.divIcon({
                html: `<div style="background: ${couleur}; width: ${taille}px; height: ${taille}px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; border: 2px solid white;">${emoji}</div>`,
                iconSize: [taille, taille],
                className: 'custom-div-icon'
            });
        }
        
        function updateMap() {
            poubellesData.forEach(p => {
                if (markers[p.id]) map.removeLayer(markers[p.id]);
                const popup = `<b>${p.type}</b><br>${p.adresse}<br>Niveau: ${p.niveau}%<br>Odeur: ${p.odeur}%<br><button onclick="envoyerVidageRegion('${p.region}')">🚛 Vider région</button>`;
                const marker = L.marker([p.lat, p.lng], { icon: getIcone(p) }).bindPopup(popup);
                marker.addTo(map);
                markers[p.id] = marker;
            });
        }
        
        // ==================== CARTES RÉGIONS ====================
        function genererCartesRegions() {
            const container = document.getElementById('regionsCards');
            container.innerHTML = '';
            for (const [key, region] of Object.entries(REGIONS)) {
                const poubellesRegion = poubellesData.filter(p => p.region === key);
                const totalNiveau = poubellesRegion.reduce((sum, p) => sum + p.niveau, 0);
                const niveauMoyen = totalNiveau / poubellesRegion.length;
                const urgentes = poubellesRegion.filter(p => p.niveau >= 80).length;
                const attention = poubellesRegion.filter(p => p.niveau >= 60 && p.niveau < 80).length;
                // Compter les types
                const typesCount = {};
                poubellesRegion.forEach(p => { typesCount[p.type] = (typesCount[p.type] || 0) + 1; });
                const typesStr = Object.entries(typesCount).map(([t, c]) => `${t}:${c}`).join(', ');
                
                const card = document.createElement('div');
                card.className = 'region-card';
                card.innerHTML = `
                    <h3>📍 ${region.nom} <span class="badge">${urgentes} urgence(s)</span></h3>
                    <div class="niveau-moyen">${Math.round(niveauMoyen)}%</div>
                    <div class="progress"><div class="progress-bar" style="width: ${niveauMoyen}%;"></div></div>
                    <div class="details">
                        <span>🔴 Urgentes: ${urgentes}</span>
                        <span>🟡 Attention: ${attention}</span>
                    </div>
                    <div class="type-list">📦 Types: ${typesStr}</div>
                    <div class="region-actions">
                        <button class="btn-small" onclick="ouvrirChoixCamion('${key}')">🚛 Envoyer camion</button>
                        <button class="btn-small" onclick="voirDetailRegion('${key}')">🔍 Détail</button>
                    </div>
                `;
                container.appendChild(card);
            }
            // Mise à jour des stats globales
            const totalUrgences = poubellesData.filter(p => p.niveau >= 80).length;
            const totalOdeurCritique = poubellesData.filter(p => p.odeur > 70 && p.niveau < 80).length;
            document.getElementById('statTotal').innerText = poubellesData.length;
            document.getElementById('statUrgence').innerText = totalUrgences;
            document.getElementById('statOdeur').innerText = totalOdeurCritique;
        }
        
        // Fonction pour ouvrir le dialogue de choix du camion
        function ouvrirChoixCamion(regionKey) {
            const typeCamion = prompt("Choisissez le type de camion :\n1 - Petit\n2 - Moyen\n3 - Grand\nEntrez 1, 2 ou 3", "2");
            if (!typeCamion) return;
            let taille = "";
            if (typeCamion === "1") taille = "petit";
            else if (typeCamion === "2") taille = "moyen";
            else if (typeCamion === "3") taille = "grand";
            else return;
            envoyerVidageRegion(regionKey, taille);
        }
        
        function envoyerVidageRegion(region, camionType = "moyen") {
            const poubellesRegion = poubellesData.filter(p => p.region === region && p.niveau >= 80);
            const nbVidees = poubellesRegion.length;
            if (nbVidees === 0) {
                alert(`Aucune poubelle urgente dans la région ${REGIONS[region].nom}`);
                return;
            }
            // Vider les poubelles
            poubellesRegion.forEach(p => { p.niveau = 0; p.odeur = Math.max(0, p.odeur - 30); });
            refreshUI();
            // Enregistrer dans l'historique
            ajouterHistorique(region, camionType, nbVidees, nbVidees);
            alert(`🚛 Camion ${camionType} envoyé à ${REGIONS[region].nom} - ${nbVidees} poubelle(s) vidée(s)`);
            // Optionnel : envoyer la commande MQTT via socket
            if (socket && socket.connected) {
                socket.emit('commande_vidage', { region: region, camionType: camionType });
            }
        }
        
        function voirDetailRegion(regionKey) {
            const poubellesRegion = poubellesData.filter(p => p.region === regionKey);
            let msg = `📊 Détail région ${REGIONS[regionKey].nom}:\n`;
            poubellesRegion.forEach(p => {
                msg += `\n${p.type}: niveau ${p.niveau}%, odeur ${p.odeur}%`;
            });
            alert(msg);
        }
        
        function envoyerVidageToutesRegions() {
            for (let r in REGIONS) {
                const urgentes = poubellesData.filter(p => p.region === r && p.niveau >= 80);
                if (urgentes.length > 0) {
                    envoyerVidageRegion(r, "moyen");
                }
            }
        }
        
        function refreshUI() {
            updateMap();
            genererCartesRegions();
        }
        
        // ==================== COMMUNICATION SERVEUR (Socket.IO) ====================
        function connecterSocket() {
            socket = io();
            socket.on('connect', () => {
                console.log('Socket connecté');
                document.getElementById('timestamp').innerHTML = '🟢 Connecté au serveur temps réel';
            });
            socket.on('maj_donnees', (data) => {
                if (data.poubelles) {
                    data.poubelles.forEach(up => {
                        const p = poubellesData.find(p => p.id === up.id);
                        if (p) { p.niveau = up.niveau; p.odeur = up.odeur; }
                    });
                    refreshUI();
                    document.getElementById('timestamp').innerHTML = `🕐 Dernière mise à jour: ${new Date().toLocaleTimeString()}`;
                }
            });
            socket.on('disconnect', () => {
                document.getElementById('timestamp').innerHTML = '🔴 Déconnecté - mode simulation';
            });
            // Simulation locale si pas de données réelles
            setTimeout(() => {
                if (poubellesData.every(p => p.niveau === 0)) demarrerSimulationLocale();
            }, 3000);
        }
        
        function demarrerSimulationLocale() {
            setInterval(() => {
                poubellesData.forEach(p => {
                    let delta = (Math.random() - 0.5) * 8;
                    let nouveau = p.niveau + delta;
                    if (nouveau > 100) nouveau = 100;
                    if (nouveau < 0) nouveau = 0;
                    p.niveau = Math.floor(nouveau);
                    p.odeur = Math.min(100, Math.floor(p.niveau * 0.6 + Math.random() * 20));
                });
                refreshUI();
                document.getElementById('timestamp').innerHTML = `🕐 Simulation locale: ${new Date().toLocaleTimeString()}`;
            }, 4000);
        }
        
        // Génération initiale des poubelles
        function genererPoubellesInitiales() {
            const types = ["MENAGER", "VERRE", "CARTON", "PAPIER"];
            const adresses = {
                nord: ["Bd Mohammed V", "Rue de la Gare", "Quartier Industriel", "Lotissement Al Amal"],
                sud: ["Bab Marrakech", "Avenue Hassan II", "Quartier Salam", "Cité Ouvrière"],
                est: ["Zone Jorf Lasfar", "Route d'Essaouira", "Hay El Massira", "Bd des FAR"],
                ouest: ["Boulevard Al Maghrib", "Rue Mohammed V", "Avenue des Nations Unies", "Rue Yougoslavie"]
            };
            let id = 1;
            for (const [regionKey, region] of Object.entries(REGIONS)) {
                const [lat0, lng0] = region.center;
                for (let i = 0; i < 4; i++) {
                    let lat = lat0 + (i * 0.003) + (regionKey === 'nord' ? 0.005 : (regionKey === 'sud' ? -0.005 : 0));
                    let lng = lng0 + (i * 0.003) + (regionKey === 'est' ? 0.006 : (regionKey === 'ouest' ? -0.004 : 0));
                    poubellesData.push({
                        id: id++,
                        region: regionKey,
                        type: types[i % types.length],
                        adresse: `${adresses[regionKey][i]}, Safi`,
                        lat: parseFloat(lat.toFixed(5)),
                        lng: parseFloat(lng.toFixed(5)),
                        niveau: 0,
                        odeur: 0
                    });
                }
            }
        }
        
        // Gestion modal historique
        function initModal() {
            const modal = document.getElementById('historyModal');
            const btn = document.getElementById('btnHistorique');
            const span = document.querySelector('.close-modal');
            btn.onclick = () => { afficherHistorique(); modal.style.display = 'flex'; };
            span.onclick = () => modal.style.display = 'none';
            window.onclick = (e) => { if (e.target === modal) modal.style.display = 'none'; };
        }
        
        // ==================== INITIALISATION ====================
        genererPoubellesInitiales();
        initHistorique();
        initMap();
        connecterSocket();
        refreshUI();
        initModal();
        
        window.envoyerVidageRegion = envoyerVidageRegion;
        window.envoyerVidageToutesRegions = envoyerVidageToutesRegions;
        window.ouvrirChoixCamion = ouvrirChoixCamion;
        window.voirDetailRegion = voirDetailRegion;
    </script>
</body>
</html>
